apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  sources:
    - chart: postgresql
      repoURL: oci://localhost:30500/postgresql
      targetRevision: 16.0.0
      helm:
        releaseName: postgresql
        valueFiles:
          - $values/argocd/values/postgresql-values.yaml
        parameters:
          - name: auth.existingSecret
            value: postgres-credentials
    - repoURL: git@github.com:SamSyntax/Sentinel-Zero-Trust.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
