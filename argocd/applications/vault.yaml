apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  sources:
    - chart: vault
      repoURL: https://helm.releases.hashicorp.com
      targetRevision: 0.28.1
      helm:
        releaseName: vault
        valueFiles:
          - $values/infra/k8s/vault/vault-values.yaml
    - repoURL: git@github.com:SamSyntax/Sentinel-Zero-Trust.git
      targetRevision: master
      ref: values
    - repoURL: git@github.com:SamSyntax/Sentinel-Zero-Trust.git
      targetRevision: master
      path: infra/k8s/vault/configure
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
