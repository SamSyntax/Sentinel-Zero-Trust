apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-bootstrap
  namespace: default 
  labels:
    app: bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-bootstrap
  labels:
    app: bootstrap
rules:
  - apiGroups: [""] 
    resources: ["secrets", "namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-bootstrap
  labels:
    app: bootstrap
subjects:
  - kind: ServiceAccount
    name: secrets-bootstrap
    namespace: default
roleRef:
  kind: ClusterRole
  name: secrets-bootstrap
  apiGroup: rbac.authorization.k8s.io
