server:
  dev:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = "true"
      }

      storage "raft" {
        path    = "/vault/data"
        node_id = "raft_node_1"
      }

      api_addr     = "http://vault.default.svc.cluster.local:8200"
      cluster_addr = "https://HOSTNAME.vault-internal:8201"

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: "standard"

  # the vault helm chart deploy vault-agent-injector with pod anti-affinity rules that require multiple node.
  # Let's loosen  the anti-affinity rules so the vault can schedule on the only node.
  injector:
    affinity: ""
