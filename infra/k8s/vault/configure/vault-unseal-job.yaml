apiVersion: batch/v1
kind: Job
metadata:
  name: vault-unseal
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-options: Prune=false
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-configurer
      containers:
        - name: vault-unseal
          image: hashicorp/vault:1.17.2
          command:
            - sh
            - -c
            - |
              set -e
              export VAULT_ADDR="http://vault-internal.default.svc.cluster.local:8200"
              apk add --no-cache curl jq

              # Wait for Vault to be initialized
              for i in $(seq 1 30); do
                if vault status -format=json 2>/dev/null | grep -q '"initialized": true'; then
                  echo "Vault is initialized"
                  break
                fi
                echo "Waiting for Vault to be initialized... ($i/30)"
                sleep 5
              done

              # Check if Vault is already unsealed
              if vault status -format=json 2>/dev/null | grep -q '"sealed": false'; then
                echo "Vault is unsealed, skipping"
                exit 0
              fi

              echo "Unsealing Vault..."
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)

              # Write the CA certificate to a file to avoid shell interpretation issues
              echo "$CACERT" > /tmp/ca.crt

              # Get the unseal keys with better error handling
              echo "Fetching unseal keys from Kubernetes secret..."
              SECRET_RESPONSE=$(curl -s -H "Authorization: Bearer $TOKEN" \
                --cacert /tmp/ca.crt \
                https://kubernetes.default.svc/api/v1/namespaces/default/secrets/vault-unseal-keys)

              # Extract and decode the unseal keys
              UNSEAL_1=$(echo "$SECRET_RESPONSE" | jq -r '.data."unseal-key-1"' | base64 -d)
              UNSEAL_2=$(echo "$SECRET_RESPONSE" | jq -r '.data."unseal-key-2"' | base64 -d)

              # Debug: Print the unseal keys (first few characters only)
              echo "Unseal key 1: ${UNSEAL_1:0:10}..."
              echo "Unseal key 2: ${UNSEAL_2:0:10}..."

              # Unseal Vault using the keys as arguments (not via stdin)
              echo "Unsealing with key 1..."
              vault operator unseal -address="$VAULT_ADDR" "$UNSEAL_1"

              echo "Unsealing with key 2..."
              vault operator unseal -address="$VAULT_ADDR" "$UNSEAL_2"

              # Verify Vault is unsealed
              if vault status -format=json 2>/dev/null | grep -q '"sealed": false'; then
                echo "Vault unsealed successfully"
                exit 0
              else
                echo "Failed to unseal Vault"
                exit 1
              fi
      restartPolicy: Never
