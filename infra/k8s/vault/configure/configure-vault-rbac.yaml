apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-configurer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-configurer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-configurer
subjects:
  - kind: ServiceAccount
    name: vault-configurer
    namespace: default
roleRef:
  kind: ClusterRole
  name: vault-configurer
  apiGroup: rbac.authorization.k8s.io
