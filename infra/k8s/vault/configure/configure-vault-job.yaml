apiVersion: batch/v1
kind: Job
metadata:
  name: configure-vault
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-options: Prune=false
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-configurer
      containers:
        - name: configure-vault
          image: hashicorp/vault:1.17.2
          command:
            - sh
            - -c
            - |
              set -e
              export VAULT_ADDR="http://vault-internal.default.svc.cluster.local:8200"
              export VAULT_TOKEN=$(cat /vault-token/token)

              # Wait for Vault to be unsealed and ready
              for i in $(seq 1 60); do
                if vault status -format=json 2>/dev/null | grep -q '"sealed": false'; then
                  echo "Vault is unsealed and ready"
                  break
                fi
                echo "Waiting for Vault to be unsealed... ($i/60)"
                sleep 5
              done

              # Verify Vault is actually responsive
              for i in $(seq 1 30); do
                if vault token lookup -format=json >/dev/null 2>&1; then
                  echo "Vault token is valid, proceeding with configuration"
                  break
                fi
                echo "Waiting for Vault to accept requests... ($i/30)"
                sleep 5
              done

              # Enable and configure PKI secrets engine
              vault secrets enable pki 2>/dev/null || echo "PKI already enabled"
              vault secrets tune -max-lease-ttl=87600h pki 2>/dev/null || echo "PKI already tuned"

              # Generate root CA if not already done
              if ! vault read -field=certificate pki/cert/ca >/dev/null 2>&1; then
                echo "Generating root CA..."
                vault write -field=certificate pki/root/generate/internal \
                  common_name="Sentinel Root CA" ttl=87600h > /tmp/root_ca.crt
              else
                echo "Root CA already exists"
              fi

              # Configure PKI role (idempotent - always overwrite)
              vault write pki/roles/sentinel-service \
                allowed_domains="svc,cluster.local" \
                allow_subdomains=true \
                allow_any_name=true \
                max_ttl="72h" \
                generate_lease=true

              # Enable Kubernetes auth method
              vault auth enable kubernetes 2>/dev/null || echo "Kubernetes auth already enabled"

              # Configure K8s auth backend
              K8S_CA_CERT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
              K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc" \
                kubernetes_ca_cert="$K8S_CA_CERT" \
                token_reviewer_jwt="$K8S_TOKEN"

              # Write policy (idempotent - always overwrite)
              vault policy write sentinel-app-policy - <<'POLICY'
              path "pki/issue/sentinel-service" {
                capabilities = ["create", "update"]
              }
              POLICY

              # Create/update K8s auth role (idempotent - always overwrite)
              vault write auth/kubernetes/role/sentinel-role \
                bound_service_account_names=sentinel-control-plane \
                bound_service_account_namespaces=sentinel-control-plane \
                policies=sentinel-app-policy \
                ttl=3600

              echo "Vault configuration complete"
          volumeMounts:
            - name: vault-token
              mountPath: /vault-token
              readOnly: true
      volumes:
        - name: vault-token
          secret:
            secretName: vault-root-token
      restartPolicy: Never
