apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-options: Prune=false
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: vault-configurer
      containers:
        - name: vault-init
          image: hashicorp/vault:1.17.2
          command:
            - sh
            - -c
            - |
              set -e
              export VAULT_ADDR="http://vault-internal.default.svc.cluster.local:8200"
              RUN apk add --no-cache curl jq

              if vault status -format=json 2>/dev/null | grep -q '"initialized": true'; then
                echo "Vault is already initialized, skipping"
                exit 0
              fi

              vault operator init -key-shares=3 -key-threshold=2 -format=json > /tmp/init-output.json

              ROOT_TOKEN=$(cat /tmp/init-output.json | grep -o '"root_token":"[^"]*"' | cut -d'"' -f4)
              UNSEAL_1=$(cat /tmp/init-output.json | grep -o '"unseal_keys_b64":\[[^]]*\]' | cut -d'[' -f2 | cut -d']' -f1 | cut -d',' -f1 | tr -d '"')
              UNSEAL_2=$(cat /tmp/init-output.json | grep -o '"unseal_keys_b64":\[[^]]*\]' | cut -d'[' -f2 | cut -d']' -f1 | cut -d',' -f2 | tr -d '"')
              UNSEAL_3=$(cat /tmp/init-output.json | grep -o '"unseal_keys_b64":\[[^]]*\]' | cut -d'[' -f2 | cut -d']' -f1 | cut -d',' -f3 | tr -d '"')

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              ROOT_TOKEN_B64=$(echo -n "$ROOT_TOKEN" | base64
              UNSEAL_1_B64=$(echo -n "$UNSEAL_1" | base64)
              UNSEAL_2_B64=$(echo -n "$UNSEAL_2" | base64)
              UNSEAL_3_B64=$(echo -n "$UNSEAL_3" | base64)

              curl -s -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --cacert $CACERT \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"vault-unseal-keys\",\"namespace\":\"default\"},\"data\":{\"root-token\":\"$ROOT_TOKEN_B64\",\"unseal-key-1\":\"$UNSEAL_1_B64\",\"unseal-key-2\":\"$UNSEAL_2_B64\",\"unseal-key-3\":\"$UNSEAL_3_B64\"}}" \
                https://kubernetes.default.svc/api/v1/namespaces/default/secrets


              echo "Vault initialized and keys stored in secret vault-unseal-keys"
      restartPolicy: Never
