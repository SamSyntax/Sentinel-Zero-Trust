apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-data-plane
  labels:
    app: data-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-plane
  template:
    metadata:
      labels:
        app: data-plane
        sentinel-zt: "injected"
    spec:
      initContainers:
        - name: sentinel-init
          image: kind.local/sentinel-init:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          args: ["--inboundPort", "15006", "--outboundPort", "15001"]
      containers:
        - name: proxy
          image: sentinel-data-plane:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 15006
          env:
            - name: CONTROL_PLANE_URL
              value: "http://sentinel-control-plane.sentinel-control-plane.svc.cluster.local:8081/api/v1/identity/issue"
            - name: ENV
              value: "kind-local"
            - name: PROXY_MODE
              value: "redirect"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CA_CERT_PATH
              value: "/etc/certs/root_ca.crt"
          volumeMounts:
            - name: vault-ca-volume
              mountPath: "/etc/certs"
              readOnly: true
      volumes:
        - name: vault-ca-volume
          secret:
            secretName: sentinel-root-ca
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-data-plane
spec:
  type: NodePort
  selector:
    app: data-plane
  ports:
    - protocol: TCP
      port: 15006
      targetPort:  15006
      nodePort: 30443
