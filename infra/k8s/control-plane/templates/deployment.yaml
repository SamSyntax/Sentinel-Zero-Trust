apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
      containers:
        - name: {{ .Values.containers.name  }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containers.port }}
          env:
            - name: SPRING_CLOUD_VAULT_URI
              value: {{ .Values.vault.uri | quote }}
            - name: SPRING_CLOUD_VAULT_TOKEN
              value: "root"
            - name: SPRING_MAIN_BANNER_MODE
              value: "OFF"
