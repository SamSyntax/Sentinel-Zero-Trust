apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "sentinel.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.containers.port }}
      targetPort: {{ .Values.containers.port }}
