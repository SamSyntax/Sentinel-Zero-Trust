apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "sentinel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector: {{- include "sentinel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.containers.port }}
      targetPort: {{ .Values.containers.port }}
      {{- if and (eq (.Values.service.type | default "ClusterIP") "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.containers.grpcPort }}
      targetPort: {{ .Values.containers.grpcPort }}
