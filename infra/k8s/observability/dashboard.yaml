apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-zt-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  sentinel-main.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Data Plane: mTLS Failures",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(count_over_time({container=\"sentinel-proxy\"} | json | level=\"ERROR\" | msg=~\"failed to establish outbound mTLS|TLS handshake failed.*|no client certificate provided|inbound connection is not TLS.*\" [$__range])) or vector(0)",
              "legendFormat": "mTLS failures",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "fixed", "fixedColor": "red" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "title": "Control Plane: Certificate Issuance",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(count_over_time({container=\"sentinel-control-plane\"} | json | message=~\"Certificate issued successfully.*\" [$__range])) or vector(0)",
              "legendFormat": "Cert Issued",
              "refId": "A"
            },
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(count_over_time({container=\"sentinel-control-plane\"} | json | message=~\"Certificate issuance failed.*\" [$__range])) or vector(0)",
              "legendFormat": "Issue Failed",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "title": "Rotation Latency (P95, 15m)",
          "type": "timeseries",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "quantile_over_time(0.95, {container=\"sentinel-proxy\"} | json | msg=\"certificate rotated successfully\" | unwrap duration [15m]) by (service)",
              "legendFormat": "{{service}} P95",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ns" }
          }
        },
        {
          "title": "Certificate Rotation Health",
          "type": "stat",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(count_over_time({container=\"sentinel-proxy\"} | json | msg=\"certificate rotated successfully\" [$__range])) by (service)",
              "legendFormat": "{{service}} rotated",
              "refId": "A"
            },
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "sum(count_over_time({container=\"sentinel-proxy\"} | json | msg=\"certificate rotation failed, will retry\" [$__range])) by (service)",
              "legendFormat": "{{service}} retry/fail",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          }
        },
        {
          "title": "Live Log Stream",
          "type": "logs",
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 9 },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "Loki" },
              "expr": "{container=~\"sentinel-control-plane|sentinel-proxy\"} | json",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": { "format": "json", "source": "Line" }
            },
            {
              "id": "convertFieldType",
              "options": {
                "fields": {
                  "renewal_time": {
                    "destinationType": "time",
                    "dateFormat": "YYYY-MM-DDTHH:mm:ssZ"
                  }
                }
              }
            }
          ],
          "options": {
            "showTime": true,
            "timezone": "browser",
            "prettifyLogMessage": true
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["sentinel-zt", "kubernetes", "mtls"],
      "timezone": "browser",
      "title": "Service Mesh Health",
      "uid": "sentinel-zt-prod"
    }
