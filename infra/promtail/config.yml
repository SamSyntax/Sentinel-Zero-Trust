server:
  http_listen_port: 9080

clients:
  - url: http://sentinel-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sentinel-proxy-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-proxy
          env: local
          __path__: /var/log/host-apps/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
      - labels:
          level:
          msg:
          trace_id:
