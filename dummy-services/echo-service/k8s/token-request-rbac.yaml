apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: echo-service-token-requester
  namespace: echo-service
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["echo-service"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: echo-service-token-requester
  namespace: echo-service
subjects:
  - kind: ServiceAccount
    name: echo-service
    namespace: echo-service
roleRef:
  kind: Role
  name: echo-service-token-requester
  apiGroup: rbac.authorization.k8s.io
