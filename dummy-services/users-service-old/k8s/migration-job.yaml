apiVersion: batch/v1
kind: Job
metadata:
  name: users-service-migration
  namespace: users-service
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: localhost:30500/users-service
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              echo "Running migration..."
              bun run drizzle-kit generate
              bun run drizzle-kit push
              timeout 60 bun run src/utils.ts || true
              echo "Migration complete"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: users-service-secret
                  key: DATABASE_URL
